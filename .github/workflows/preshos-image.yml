name: PRESHos candidate image
on:
  pull_request:
    branches: [preshos-v2.25.1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preshos-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.20.0'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10.6.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
      - run: pnpm test:preshos
  image:
    needs: test
    # Never publish code from another fork using this repository's token.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Candidate tag
        id: tag
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision="$(git rev-parse HEAD)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:2.25.1-preshos-$revision" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          build-args: NEXT_PUBLIC_VERSION=2.25.1-preshos-${{ steps.tag.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.revision }}
          cache-from: type=gha,scope=preshos
          cache-to: type=gha,mode=max,scope=preshos
      - name: Record immutable Railway image reference
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > railway-image.txt
          printf 'Candidate tag: `%s`\n\nRailway reference (requires Chris approval): `%s@%s`\n' "$TAG" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: railway-image-${{ steps.tag.outputs.revision }}
          path: railway-image.txt
